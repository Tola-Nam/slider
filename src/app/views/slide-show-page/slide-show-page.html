<!-- Top Left -->
<div class="fixed top-0 left-0 m-4 z-10">
  <app-custom-style></app-custom-style>
</div>

<!-- Top Right -->
<div class="fixed top-0 right-0 m-4 z-10">
  <app-custom-style></app-custom-style>
</div>

<!-- Middle Left -->
<div class="fixed top-1/2 left-0 transform -translate-y-1/2 m-4 z-10">
  <app-custom-style></app-custom-style>
</div>

<!-- Middle Right -->
<div class="fixed top-1/2 right-0 transform -translate-y-1/2 m-4 z-10">
  <app-custom-style></app-custom-style>
</div>

<!-- Main Scrollable Content -->
<div class="w-4/5 mx-auto py-12">
  <div class="max-w-3xl mx-auto bg-white p-8 text-gray-900">

    <div *ngFor="let section of sections" class="mb-8">

      <!-- Section title -->
      <h2 class="text-xl font-bold mb-4">
        {{ section.title }}
      </h2>

      <!-- Description -->
      <p class="mb-4">
        {{ section.description }}
      </p>

      <!-- Bullet list -->
      <ul *ngIf="section.bullets"
          class="list-disc pl-6 space-y-2 mb-4">
        <li *ngFor="let item of section.bullets">
          {{ item }}
        </li>
      </ul>

      <!-- Tools -->
      <div *ngIf="section.tools">
        <p class="text-blue-700 font-semibold mb-2">
          ឧបករណ៍ប្រើប្រាស់
        </p>

        <div *ngFor="let tool of section.tools">
          <p>
            + <span class="font-bold">{{ tool.name }}</span>
            {{ tool.description }}
          </p>
        </div>

        <!-- Image -->
        <div class="flex justify-center mt-6">
          <img
            [src]="wifiImage"
            alt="WiFi Analyzer"
            class="w-48 h-48 object-contain shadow-md rounded-lg"
          />

        </div>

        <div *ngFor="let tool of section.tools">
          <p>
            + <span class="font-bold">{{ tool.shortDescription }}</span>
            {{ tool.testSpeed }}
          </p>
        </div>

        <!-- Image -->
        <div class="flex justify-center mt-6">
          <img
            [src]="testSpeed"
            alt="WiFi Analyzer"
            class="w-48 h-48 object-contain shadow-md rounded-lg"
          />

        </div>
      </div>

    </div>

  </div>

  <div class="w-4/5 mx-auto flex justify-between px-2 py-4">
    <a (click)="goToRoute('')" routerLinkActive="active" class="text-blue-500 hover:pointer">
      Previous Page
      </a>
    <a (click)="goToRoute('/analizse')" routerLinkActive="active" class="text-blue-500 hover:pointer">
      Next Page
    </a>
  </div>
  <p class="text-center">2</p>

</div>

<!-- Navigation Links -->
